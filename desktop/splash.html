<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenGrokBot Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAFAF8;
      color: #1B2421;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: #18836B;
      color: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(24, 131, 107, 0.25);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(24, 131, 107, 0.15);
      border-top-color: #18836B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      color: #1B2421;
    }
    .subtitle {
      font-size: 13px;
      color: #64748B;
      font-weight: 400;
    }
    .dots-indicator {
      display: flex;
      gap: 6px;
      margin-top: 24px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #CBD5E1;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); background: #18836B; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">OG</div>
    <div class="spinner"></div>
    <div class="title">OpenGrokBot Studio</div>
    <div class="subtitle">Starting local AI workforce workspace…</div>
    <div class="dots-indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
